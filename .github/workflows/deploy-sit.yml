name: Deploy ADF_Publish to SIT_ADF_Publish

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your main repo
      - name: Checkout main repo
        uses: actions/checkout@v3

      # 2️⃣ Checkout ARM templates from your public repo into 'arm_repo' folder
      - name: Checkout ARM Templates Repo
        uses: actions/checkout@v3
        with:
          repository: datawarior-06/data-and-analytics
          ref: main

      # 3️⃣ Debug: list files to verify ARM templates location
      - name: List files in ARM repo
        run: ls -R data-and-analytics-factory

      # 4️⃣ Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 5️⃣ Deploy ARM Templates to SIT
      - name: Deploy ADF ARM Templates to SIT
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup 
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.SIT_RESOURCE_GROUP }}
          template: data-and-analytics-factory/ARMTemplateForFactory.json
          parameters: data-and-analytics-factory/ARMTemplateParametersForFactory.json
          failOnStdErr: true
          deploymentMode: Incremental