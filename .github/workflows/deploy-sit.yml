name: Deploy ADF_Publish to SIT_ADF_Publish

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repo (contains both workflow and ARM templates)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Debug: list files to verify ARM templates location
      - name: List files
        run: ls -R data-and-analytics-factory

      # 3️⃣ Login to Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4️⃣ Deploy ARM Templates to SIT
      - name: Deploy ADF ARM Templates to SIT
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup 
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.SIT_RESOURCE_GROUP }}
          template: data-and-analytics-factory/ARMTemplateForFactory.json
          parameters: data-and-analytics-factory/ARMTemplateParametersForFactory.json
          deploymentMode: Incremental
          failOnStdErr: true