name: Deploy Azure Data Factory to SIT Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
  
    steps:
      # ========================================
      # STEP 1: CHECKOUT REPOSITORY
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v3

      # ========================================
      # STEP 2: LOAD ENVIRONMENT VARIABLES FROM sit.env
      # ========================================
      - name: Load SIT environment variables
        run: |
          echo "=== Loading environment variables from .github/workflows/env/sit.env ==="
          
          if [ -f .github/workflows/env/sit.env ]; then
            # Load variables into GitHub environment
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ "$key" =~ ^#.*$ ]] && continue
              [[ -z "$key" ]] && continue
              
              # Remove any whitespace
              key=$(echo "$key" | xargs)
              value=$(echo "$value" | xargs)
              
              # Export to GitHub environment
              echo "$key=$value" >> $GITHUB_ENV
              echo "Loaded: $key=$value"
            done < .github/workflows/env/sit.env
            
            echo "✓ Environment variables loaded successfully"
          else
            echo "✗ ERROR: .github/workflows/env/sit.env file not found!"
            echo "Listing .github/workflows/ contents:"
            ls -la .github/workflows/
            echo ""
            echo "Checking if env directory exists:"
            ls -la .github/workflows/env/ || echo "env directory does not exist"
            exit 1
          fi
          
          echo ""
          echo "=== Environment Configuration ==="
          echo "Resource Group: $RESOURCE_GROUP"
          echo "ADF Name: $ADF_NAME"
          echo "Location: $LOCATION"
          echo "Databricks Host: $DATABRICKS_HOST"

      # ========================================
      # STEP 3: DEBUG - LIST FILES
      # ========================================
      - name: List repository files
        run: |
          echo "=== Repository Structure ==="
          ls -R
          echo ""
          echo "=== ARM Template Directory ==="
          ls -la data-and-analytics-factory/ || echo "ARM template directory not found!"

      # ========================================
      # STEP 3: VALIDATE ARM TEMPLATE STRUCTURE
      # ========================================
      - name: Check ARM template structure
        run: |
          echo "=== Checking if factory resource exists in template ==="
          if grep -q '"type": "Microsoft.DataFactory/factories"' data-and-analytics-factory/ARMTemplateForFactory.json; then
            echo "✓ Factory resource found in template"
            grep -A 10 '"type": "Microsoft.DataFactory/factories"' data-and-analytics-factory/ARMTemplateForFactory.json
          else
            echo "⚠ WARNING: Factory resource NOT found in template - only child resources will be deployed"
          fi
          echo ""
          echo "=== Template Resource Types ==="
          grep '"type": "Microsoft.DataFactory' data-and-analytics-factory/ARMTemplateForFactory.json || echo "No DataFactory resources found"

      # ========================================
      # STEP 4: VALIDATE JSON SYNTAX
      # ========================================
      - name: Validate JSON files
        run: |
          echo "=== Validating ARM Template JSON ==="
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          
          jq empty data-and-analytics-factory/ARMTemplateForFactory.json && echo "✓ Template JSON is valid" || exit 1
          jq empty data-and-analytics-factory/ARMTemplateParametersForFactory.json && echo "✓ Parameters JSON is valid" || exit 1
          
          echo ""
          echo "=== Parameters in file ==="
          jq '.parameters' data-and-analytics-factory/ARMTemplateParametersForFactory.json

      # ========================================
      # STEP 5: AZURE LOGIN
      # ========================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ========================================
      # STEP 6: DEBUG - CHECK TARGET ENVIRONMENT
      # ========================================
      - name: Debug - Check target resource group and factory
        run: |
          echo "=== Target Environment Details ==="
          echo "Subscription ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo "Factory Name: ${{ env.ADF_NAME }}"
          echo "Location: ${{ env.LOCATION }}"
          echo ""
          
          echo "=== Checking if Resource Group exists ==="
          if az group show --name ${{ env.RESOURCE_GROUP }} &> /dev/null; then
            echo "✓ Resource Group exists"
          else
            echo "✗ Resource Group does NOT exist"
            exit 1
          fi
          
          echo ""
          echo "=== Checking if Data Factory exists ==="
          if az datafactory show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ADF_NAME }} &> /dev/null; then
            echo "✓ Data Factory exists"
            az datafactory show \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.ADF_NAME }} \
              --query "{name:name, location:location, provisioningState:provisioningState}" \
              -o table
          else
            echo "⚠ Data Factory does NOT exist - will be created"
          fi

      # ========================================
      # STEP 7: CREATE DATA FACTORY IF NOT EXISTS
      # ========================================
      - name: Create Data Factory if not exists
        run: |
          echo "=== Ensuring Data Factory exists ==="
          echo "Attempting to create factory: ${{ env.ADF_NAME }}"
          
          if ! az datafactory show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ADF_NAME }} &> /dev/null; then
            
            echo "Creating new Data Factory..."
            
            # Try to create, handle the case where name is globally taken
            if az datafactory create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --factory-name ${{ env.ADF_NAME }} \
              --location ${{ env.LOCATION }} 2>&1 | tee /tmp/create_output.txt; then
              echo "✓ Data Factory created successfully"
            else
              if grep -q "DataFactoryNameInUse" /tmp/create_output.txt; then
                echo "✗ ERROR: Factory name '${{ env.ADF_NAME }}' is already in use globally"
                echo "This name exists in another resource group or subscription"
                echo ""
                echo "SOLUTIONS:"
                echo "1. Change ADF_NAME in sit.env to a different unique name"
                echo "2. Deploy to the resource group where this factory already exists"
                echo "3. Delete the existing factory if it's no longer needed"
                echo ""
                echo "To find where the factory exists, run:"
                echo "az resource list --name ${{ env.ADF_NAME }} --resource-type Microsoft.DataFactory/factories"
                exit 1
              else
                echo "✗ Factory creation failed for another reason"
                cat /tmp/create_output.txt
                exit 1
              fi
            fi
          else
            echo "✓ Data Factory already exists in this resource group - skipping creation"
          fi

      # ========================================
      # STEP 8: VALIDATE ARM TEMPLATE
      # ========================================
      - name: Validate ARM Template deployment
        run: |
          echo "=== Validating ARM Template ==="
          az deployment group validate \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file data-and-analytics-factory/ARMTemplateForFactory.json \
            --parameters data-and-analytics-factory/ARMTemplateParametersForFactory.json \
            --parameters factoryName=${{ env.ADF_NAME }} \
            --verbose
          
          if [ $? -eq 0 ]; then
            echo "✓ Template validation successful"
          else
            echo "✗ Template validation failed"
            exit 1
          fi

      # ========================================
      # STEP 9: DEPLOY ARM TEMPLATE
      # ========================================
      - name: Deploy ADF ARM Templates to SIT
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: data-and-analytics-factory/ARMTemplateForFactory.json
          parameters: data-and-analytics-factory/ARMTemplateParametersForFactory.json factoryName=${{ env.ADF_NAME }}
          deploymentMode: Incremental
          deploymentName: ADF-Deployment-${{ github.run_number }}
          failOnStdErr: false

      # ========================================
      # STEP 10: VERIFY DEPLOYMENT
      # ========================================
      - name: Verify deployment
        if: always()
        run: |
          echo "=== Deployment Status ==="
          az deployment group list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].{Name:name, State:properties.provisioningState, Timestamp:properties.timestamp}" \
            -o table
          
          echo ""
          echo "=== Checking for deployment errors ==="
          DEPLOYMENT_NAME=$(az deployment group list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          
          if [ ! -z "$DEPLOYMENT_NAME" ]; then
            az deployment operation group list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name "$DEPLOYMENT_NAME" \
              --query "[?properties.provisioningState=='Failed'].{Resource:properties.targetResource.resourceName, Error:properties.statusMessage.error.message}" \
              -o table
          fi
          
          echo ""
          echo "=== Final Data Factory Status ==="
          az datafactory show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.ADF_NAME }} \
            --query "{Name:name, Location:location, State:provisioningState, ID:id}" \
            -o table

      # ========================================
      # STEP 11: LIST DEPLOYED RESOURCES (OPTIONAL)
      # ========================================
      - name: List deployed Data Factory resources
        if: success()
        run: |
          echo "=== Deployed Pipelines ==="
          az datafactory pipeline list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --factory-name ${{ env.ADF_NAME }} \
            --query "[].name" \
            -o table || echo "No pipelines found"
          
          echo ""
          echo "=== Deployed Datasets ==="
          az datafactory dataset list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --factory-name ${{ env.ADF_NAME }} \
            --query "[].name" \
            -o table || echo "No datasets found"
          
          echo ""
          echo "=== Deployed Linked Services ==="
          az datafactory linked-service list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --factory-name ${{ env.ADF_NAME }} \
            --query "[].name" \
            -o table || echo "No linked services found"

      # ========================================
      # STEP 12: CLEANUP ON FAILURE (OPTIONAL)
      # ========================================
      - name: Show troubleshooting info on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "DEPLOYMENT FAILED - TROUBLESHOOTING INFO"
          echo "=========================================="
          echo ""
          echo "1. Environment configuration from sit.env:"
          echo "   Resource Group: ${{ env.RESOURCE_GROUP }}"
          echo "   Factory Name: ${{ env.ADF_NAME }}"
          echo "   Location: ${{ env.LOCATION }}"
          echo ""
          echo "2. Recent deployment operations:"
          DEPLOYMENT_NAME=$(az deployment group list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[0].name" -o tsv)
          
          if [ ! -z "$DEPLOYMENT_NAME" ]; then
            az deployment operation group list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name "$DEPLOYMENT_NAME" \
              -o table
          fi
          echo ""
          echo "3. Check the ARM template and parameters files for syntax errors"
          echo "4. Verify that all required secrets are set in GitHub repository settings"
          echo "5. Ensure sit.env file has correct values"
          echo "6. Check if factory name is globally unique in Azure"
