name: Deploy ADF_Publish to SIT_ADF_Publish

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout your repo with ARM templates
      - name: Checkout ARM Templates Repo
        uses: actions/checkout@v3
        with:
          repository: datawarior-06/data-and-analytics
          ref: main   # branch containing ARM templates
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Login to Azure using service principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      # Deploy ADF ARM templates to SIT
      - name: Deploy ADF ARM Templates to SIT
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.SIT_RESOURCE_GROUP }}
          template: ARMTemplateForFactory.json
          parameters: ARMTemplateParametersForFactory.json